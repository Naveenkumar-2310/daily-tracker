services:
  - type: web
    name: daily-tracker-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: yarn && yarn build
    startCommand: yarn start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: DB_CONNECTION_STRING
        sync: false
